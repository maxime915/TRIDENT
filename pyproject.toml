[project]
name = "trident"
version = "0.3.2"
description = "A package for preprocessing whole-slide images."
authors = [
    { name = "Guillaume Jaume", email = "guillaume.jaume@unil.ch" },
    { name = "Andrew Zhang", email = "andrewzh@mit.edu" },
    { name = "Paul Doucet", email = "homedoucetpaul@gmail.com" },
]
license = { text = "CC BY-NC-ND 4.0" }
requires-python = ">=3.10,<3.13"
dependencies = [
    "ipywidgets",
    "torch",
    "torchvision",
    "numpy",
    "pandas",
    "tqdm",
    "h5py",
    "matplotlib",
    "opencv-python",
    "scikit-image>=0.20",
    "openslide-python",
    "Pillow",
    "geopandas",
    "shapely",
    "requests",
    "huggingface_hub",
    "openslide-bin",
    "bioio",
    "bioio-ome-tiff",
    "bioio-tifffile",
    "pyvips[binary]",
    # Core model dependencies
    "transformers>=4.41,<5",
    "timm>=0.9.16,<2",
    "einops",
    "einops_exts",
    "scipy",
    "segmentation-models-pytorch",
    "safetensors",
]

[project.urls]
Repository = "https://github.com/mahmoodlab/TRIDENT"

[project.scripts]
trident = "trident.cli:main"
run_batch_of_slides = "run_batch_of_slides:main"
run_single_slide = "run_single_slide:main"
trident-doctor = "trident.cli_doctor:main"

[project.optional-dependencies]
patch-encoders = [
    "fairscale",
    "timm_ctp",
    "conch",
    "musk",
]
slide-encoders = [
    "environs==11.0.0",
    "sacremoses==0.1.1",
    "gigapath",
    "madeleine",
]
converter = [
    "pylibCZIrw",
]
convert = [
    "pylibCZIrw",
]
czi = [
    "pylibCZIrw",
]
bioformats = [
    "bioio-bioformats",
]
full = [
    "environs==11.0.0",
    "sacremoses==0.1.1",
    "fairscale",
    "timm_ctp",
    "conch",
    "musk",
    "gigapath",
    "madeleine",
    "pylibCZIrw",
]
omezarr = [
    "ngff-zarr>=0.12",
    "dask>=2024.10",
    "cf-units>=3.1",
    "zarr>=3.0.0a0",
]

# Git-hosted packages must be declared here for uv to resolve them
# (PEP 621 dependency strings can't carry VCS URLs on their own).
[tool.uv.sources]
conch = { git = "https://github.com/Mahmoodlab/CONCH.git" }
musk = { git = "https://github.com/lilab-stanford/MUSK" }
gigapath = { git = "https://github.com/prov-gigapath/prov-gigapath.git" }
madeleine = { git = "https://github.com/mahmoodlab/MADELEINE.git" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trident"]

# Ship the non-Python data files with the package (equivalent to the
# old poetry `include` + include_package_data settings)
[tool.hatch.build.targets.wheel.force-include]
"trident/slide_encoder_models/local_ckpts.json" = "trident/slide_encoder_models/local_ckpts.json"
"trident/patch_encoder_models/local_ckpts.json" = "trident/patch_encoder_models/local_ckpts.json"
"trident/segmentation_models/local_ckpts.json" = "trident/segmentation_models/local_ckpts.json"
